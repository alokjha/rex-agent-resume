name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 shellcheck
      - name: Every Lua file compiles
        run: for f in *.lua test/*.lua; do lua5.1 -e "assert(loadfile('$f'))" || exit 1; done
      - run: lua5.1 test/run.lua
      - run: shellcheck install.sh
